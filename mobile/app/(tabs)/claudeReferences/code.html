<script>
        // Simple toggle visual logic for custom styling
        document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if(this.checked) {
                    this.style.left = 'auto';
                    this.style.right = '0';
                    this.style.borderColor = '#b8ccb8'; // primary
                } else {
                    this.style.left = '0';
                    this.style.right = 'auto';
                    this.style.borderColor = '#434843'; // outline-variant
                }
            });
            // Initialize state
            if(!checkbox.checked) {
                checkbox.style.left = '0';
                checkbox.style.right = 'auto';
            }
        });
    </script>

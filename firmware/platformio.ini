; PlatformIO Project Configuration File

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = 
  -DCORE_DEBUG_LEVEL=0
  -I include
  -std=gnu++17

[env:display]
board = seeed_xiao_esp32s3
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_src_filter = +<display/> +<buddies/>
; S3-specific settings moved here
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L
board_build.arduino.usb_cdc_on_boot = 1
build_flags = 
  ${env.build_flags}
  -DBOARD_SCREEN_COMBO=501
  -D LV_CONF_INCLUDE_SIMPLE=1
lib_deps = 
  bblanchon/ArduinoJson@^7.2.2
  adafruit/Adafruit Unified Sensor@^1.1.15
  https://github.com/Seeed-Studio/Seeed_GFX.git
  https://github.com/Seeed-Studio/Seeed_Arduino_RoundDisplay.git
  lvgl/lvgl @ ^9.0.0
  adafruit/RTClib@^2.1.4
  h2zero/NimBLE-Arduino
  adafruit/DHT sensor library@^1.4.7
  adafruit/Adafruit BMP280 Library@^3.0.0

[env:sensor]
board = esp32dev
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_src_filter = +<sensor/> +<buddies/>
lib_deps = 
  bblanchon/ArduinoJson@^7.2.2
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/DHT sensor library@^1.4.7
  adafruit/Adafruit BMP280 Library@^3.0.0
  h2zero/NimBLE-Arduino